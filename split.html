<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>TV Split View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 1920px; height: 1080px; background: #000; overflow: hidden; font-family: Arial, sans-serif; }
        .pane { position: absolute; top: 0; width: 960px; height: 1080px; border: 4px solid #111; }
        .pane.active { border-color: #0a84ff; }
        .pane.full { left: 0 !important; width: 1920px; z-index: 2; border-color: #000; }
        .pane.hidden { display: none; }
        #left { left: 0; }
        #right { left: 960px; }
        .pane iframe { width: 100%; height: 100%; border: 0; }
        #diag { position: absolute; left: 20px; right: 20px; bottom: 20px; z-index: 5; padding: 12px 16px;
                background: rgba(0,0,0,.8); color: #9f9; font-size: 20px; line-height: 1.4; white-space: pre-wrap; }
        #hint { position: absolute; top: 20px; left: 50%; margin-left: -460px; width: 920px; z-index: 5; padding: 10px;
                background: rgba(0,0,0,.75); color: #ddd; font-size: 22px; text-align: center; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="left" class="pane active"><div id="player-left"></div></div>
    <div id="right" class="pane"><div id="player-right"></div></div>
    <div id="hint">◀ ▶ pick side · OK play/pause · OK OK (double) full screen · ▲ ▼ next/prev video</div>
    <div id="diag"></div>
    <script src="split.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
